<html>
    <head>
        <title>The price you gotta pay</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <h1>The price you gotta pay</h1>
        <p class="p1">Up to ten people fight in a crazy auction to win a pixel car.</p>
        <div class="container">
            <div class="flex">
                <div class="auction contained flexed">
                    <h2>Current auction: pixel car</h2>
                    <img class="bid_item" src="car.png">
                </div>
                <div class="signup contained flexed">
                    <h2>Sign up</h2>
                    <p class="p2">Max ten players</p>
                </div>
            </div>
            <div class="bid contained">
                <h2>Place a bid</h2>
            </div>
            <div class="leaderboard contained">
                <h2>Leaderboard</h2>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
